name: 文件批量重命名
description: 按规则批量重命名文件，支持序号、日期、正则替换、大小写转换等模式
version: 1.0.1
author: kuafu-community
category: productivity
keywords:
  - 文件管理
  - 批量重命名
  - 文件整理
  - batch rename
  - 文件操作
  - 整理
steps:
  - 确认目标目录和文件范围（所有文件/特定扩展名/正则匹配）
  - 选择重命名模式：序号前缀、日期前缀、正则替换、大小写转换、扩展名修改
  - 先预览重命名结果（dry-run 模式），确认无冲突
  - 执行重命名，处理文件名冲突（自动添加编号后缀）
  - 输出重命名前后对照表，确认无文件丢失
pitfalls:
  - 始终先 dry-run 预览，确认再执行
  - 操作前检查是否有同名文件冲突
  - 不要修改程序依赖的配置文件路径
  - 跨目录移动重命名需小心处理相对路径
  - 中文文件名在某些系统可能有编码问题
