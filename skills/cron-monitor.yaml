name: 定时任务与监控
description: 设置定时脚本，监控系统资源、文件变化和服务可用性，异常时自动通知
version: 1.0.0
author: kuafu-community
category: devops
keywords:
  - cron
  - 定时任务
  - 监控
  - 系统监控
  - 告警
  - 自动化运维
steps:
  - 确认监控目标和指标（CPU/内存/磁盘/服务端口/文件变更）
  - 编写监控脚本：采集指标、阈值判断、结果格式化
  - 配置 cron 表达式，设置合理的检查间隔
  - 实现异常通知机制（飞书/邮件/日志文件）
  - 添加日志轮转，避免日志文件无限增长
  - 测试监控脚本在异常情况下的触发和恢复
pitfalls:
  - cron 环境变量有限，脚本中使用绝对路径
  - 监控频率不要太高（建议 ≥ 1 分钟），避免误报
  - 告警要有去重机制，避免重复通知
  - 监控系统本身也要被监控（健康检查）
  - 磁盘监控注意 /tmp 和 /var/log 目录的清理
